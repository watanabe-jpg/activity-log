<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<script>
// 表示テーマ：auto（端末に合わせる）/ light / dark。端末ごとに保存
(function(){
  var pref='auto'; try{ pref=localStorage.getItem('actlog-theme')||'auto'; }catch(e){}
  var dark = pref==='dark' || (pref==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACTLOG">
<title>ACTLOG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --surface:#14181d; --surface2:#1b2027; --line:#262d35;
  --text:#e9eef3; --muted:#8a96a3; --dim:#5a6570;
  --accent:#c8f560; --accent-ink:#141a05;
  --ride:#4fd1e8; --strength:#ff8a4c; --sober:#3ddc97; --drink:#ff5d6c; --body:#a98bff;
  --heat0:#1a1f25; --accent-t:#c8f560; --navbg:rgba(11,13,16,.92); --shadow:none;
  --r:16px;
  --num:'Barlow Condensed', -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
:root[data-theme="light"]{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#edf0f3; --line:#dde3e9;
  --text:#151a20; --muted:#5b6672; --dim:#8b96a1;
  --accent:#c8f560; --accent-ink:#141a05; --accent-t:#5a8500;
  --ride:#0e9fbb; --strength:#e5642a; --sober:#10a468; --drink:#e2374a; --body:#7656e3;
  --heat0:#e7ebef; --navbg:rgba(255,255,255,.92); --shadow:0 1px 3px rgba(20,26,32,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif;font-size:15px;line-height:1.5;
  min-height:100dvh;overscroll-behavior-y:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;user-select:text;-webkit-user-select:text}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hidden{display:none!important}

/* ── layout ── */
#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(88px + var(--safe-b))}
header.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-family:var(--num);font-weight:700;font-size:24px;letter-spacing:.08em}
.brand b{color:var(--accent-t)}
.datebar{display:flex;align-items:center;gap:4px}
.datebar .d{font-family:var(--num);font-size:22px;font-weight:600;min-width:118px;text-align:center}
.datebar .d small{font-family:inherit;font-size:14px;color:var(--muted);margin-left:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface)}
.iconbtn:disabled{opacity:.3}
.iconbtn svg{width:20px;height:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent-t)}
section.view{display:none}
section.view.on{display:block}

.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:8px;height:8px;border-radius:50%}
.card h2 .r{margin-left:auto;font-weight:600;color:var(--dim);font-size:12px;letter-spacing:0}
.label{font-size:12px;color:var(--muted)}

/* ── stepper ── */
.bodyrow{padding:10px 0;border-top:1px solid var(--line)}
.bodyrow:first-of-type{border-top:0}
.bodyrow .nm{font-size:13px;color:var(--muted);line-height:1.3;margin-bottom:6px;display:flex;justify-content:space-between}
.bodyrow .nm .prev{font-size:12px;color:var(--dim)}
.stepper{display:grid;grid-template-columns:48px 56px 1fr 56px 48px;gap:6px;align-items:center}
.stepper button{height:48px;border-radius:12px;background:var(--surface2);font-family:var(--num);font-size:18px;font-weight:600}
.stepper button.big{font-size:22px}
.stepper button:active{background:var(--line)}
.stepper .val{text-align:center;font-family:var(--num);font-size:30px;font-weight:600;line-height:1}
.stepper .val small{font-size:14px;color:var(--muted);margin-left:2px}
.stepper.unsaved .val{color:var(--muted)}
.btn{height:52px;border-radius:14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.danger{background:rgba(255,93,108,.12);color:var(--drink)}
.btn:active{transform:scale(.98)}
.saved-note{font-size:12px;color:var(--dim);text-align:right;margin-top:8px;min-height:18px}

/* ── alcohol ── */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2 button{height:64px;border-radius:14px;background:var(--surface2);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent}
.seg2 button svg{width:22px;height:22px}
.seg2 button.on.no{border-color:var(--sober);color:var(--sober);background:rgba(61,220,151,.1)}
.seg2 button.on.yes{border-color:var(--drink);color:var(--drink);background:rgba(255,93,108,.1)}

/* ── exercise ── */
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0;padding-top:2px}
.ex-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.ex-head .nm{font-weight:700;font-size:16px}
.ex-head .tg{font-size:12px;color:var(--muted)}
.ex-head .ok{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:20px;padding:2px 9px;letter-spacing:.05em}
.sets{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sets .s{min-width:52px;height:30px;border-radius:9px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--num);font-size:16px;color:var(--dim);padding:0 8px}
.sets .s.done{border:0;background:rgba(255,138,76,.16);color:var(--strength);font-weight:600}
.sets .s.extra{border:0;background:rgba(255,138,76,.08);color:var(--strength)}
.ex-ctrl{display:grid;grid-template-columns:44px 1fr 44px 1.4fr;gap:6px;align-items:center}
.ex-ctrl.time{grid-template-columns:44px 1fr 44px 48px 1.4fr}
.ex-ctrl button{height:48px;border-radius:12px;background:var(--surface2);font-family:var(--num);font-size:22px;font-weight:600}
.ex-ctrl .v{text-align:center;font-family:var(--num);font-size:28px;font-weight:600}
.ex-ctrl .v small{font-size:13px;color:var(--muted);margin-left:1px}
.ex-ctrl .go{background:var(--strength);color:#1d0d03;font-family:inherit;font-size:15px;font-weight:800}
.ex-ctrl .tm{display:grid;place-items:center}
.ex-ctrl .tm svg{width:22px;height:22px}
.ex-foot{display:flex;justify-content:flex-end;margin-top:6px}
.linkbtn{font-size:12px;color:var(--muted);padding:6px 4px}
.linkbtn:disabled{opacity:.3}

/* timer overlay */
#timer{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
#timer .t-name{font-size:18px;font-weight:700;color:var(--muted)}
#timer .t-sec{font-family:var(--num);font-size:140px;font-weight:700;line-height:1;color:var(--strength)}
#timer .t-sec.hit{color:var(--accent-t)}
#timer .t-target{font-size:14px;color:var(--dim)}
#timer .t-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;width:100%;max-width:360px}

/* ── home ── */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today .t{background:var(--surface2);border-radius:12px;padding:12px 10px}
.today .t .k{font-size:11px;color:var(--muted);font-weight:600}
.today .t .v{font-family:var(--num);font-size:28px;font-weight:600;line-height:1.1;margin-top:2px}
.today .t .v small{font-size:13px;color:var(--muted)}
.today .t .sub{font-size:11px;color:var(--dim);font-family:var(--num)}
.up{color:var(--drink)} .down{color:var(--sober)}
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.streak{border-radius:12px;padding:12px 10px;background:var(--surface2);position:relative;overflow:hidden}
.streak::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.streak .k{font-size:11px;color:var(--muted);font-weight:600}
.streak .v{font-family:var(--num);font-size:40px;font-weight:700;line-height:1;color:var(--c)}
.streak .v small{font-size:14px;color:var(--muted);margin-left:2px;font-weight:600}
.streak .best{font-size:11px;color:var(--dim)}
.totals{width:100%;border-collapse:collapse}
.totals th,.totals td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.totals tr:first-child th,.totals tr:first-child td{border-top:0}
.totals th{text-align:left;font-weight:600;font-size:13px;color:var(--muted)}
.totals thead th{font-size:11px;color:var(--dim);text-align:right;border:0;padding-top:0}
.totals thead th:first-child{text-align:left}
.totals td{font-family:var(--num);font-size:20px;font-weight:600}
.totals td small{font-size:12px;color:var(--muted);margin-left:2px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{height:32px;padding:0 12px;border-radius:20px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--c,var(--accent));color:#0b0d10}
.heat-wrap{overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.heat-wrap::-webkit-scrollbar{display:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:14px repeat(7,13px);gap:3px;width:max-content}
.heat .m{font-size:10px;color:var(--dim);white-space:nowrap;grid-row:1;line-height:14px}
.heat .c{width:13px;height:13px;border-radius:3px;background:var(--heat0)}
.heat .c.f{background:transparent}
.heat .c.today{outline:1.5px solid var(--text);outline-offset:0}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--dim);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ── ride ── */
.ride-row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.month-h + .ride-row{border-top:0}
.month-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;padding:14px 0 4px}
.month-h:first-child{padding-top:0}
.ride-row .dt{font-family:var(--num);line-height:1.15}
.ride-row .dt b{display:block;font-size:22px;font-weight:600}
.ride-row .dt small{font-size:11px;color:var(--muted)}
.ride-row .km{font-family:var(--num);font-size:28px;font-weight:600;line-height:1}
.ride-row .km small{font-size:13px;color:var(--muted);margin-left:2px}
.ride-row .meta{font-size:12px;color:var(--muted);font-family:var(--num);margin-top:2px}
.z2chip{font-family:var(--num);font-weight:700;font-size:20px;line-height:1;border-radius:10px;padding:6px 8px;background:rgba(61,220,151,.14);color:var(--sober);text-align:center;min-width:58px}
.z2chip small{font-size:11px}
.z2chip small:last-child{display:block;font-size:9px;font-weight:700;opacity:.85;margin-top:3px;font-family:-apple-system,'Hiragino Sans',sans-serif}
.backbtn{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px 0 6px;border-radius:12px;background:var(--surface);font-weight:700;font-size:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.backbtn svg{width:20px;height:20px}
.ride-title{font-size:15px;color:var(--muted);font-weight:700;margin:4px 2px 10px;display:flex;align-items:center;gap:6px}
.ride-title .num{font-size:24px;color:var(--text)}
.tag{font-size:11px;font-weight:800;background:var(--surface2);color:var(--muted);border-radius:6px;padding:2px 7px}
.bigpct{font-family:var(--num);font-size:60px;font-weight:700;line-height:1;color:var(--sober)}
.zbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 8px;background:var(--surface2)}
.zrow{display:grid;grid-template-columns:10px 1fr auto 52px 40px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.zrow i{width:10px;height:10px;border-radius:3px}
.zrow .rng{color:var(--dim);font-size:13px}
.zrow .num{text-align:right;font-size:16px}
.zrow .pct{color:var(--muted)}
#rideMap{height:300px;border-radius:12px;overflow:hidden;background:var(--surface2);z-index:0}
.leaflet-container{background:var(--surface2)!important;font:12px/1.4 -apple-system,sans-serif}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.chart-t{font-size:12px;color:var(--muted);font-weight:700;margin-top:10px;display:flex;gap:6px}
.chart-t span{color:var(--dim);font-weight:600}
.chart{height:130px}

/* ── settings ── */
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .nm{font-size:14px}
.srow .nm small{display:block;font-size:11px;color:var(--dim)}
.mini{display:grid;grid-template-columns:40px 64px 40px;gap:4px;align-items:center}
.mini button{height:40px;border-radius:10px;background:var(--surface2);font-family:var(--num);font-size:20px;font-weight:600}
.mini .v{text-align:center;font-family:var(--num);font-size:22px;font-weight:600}
.zonebar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 8px}
.zonebar i{display:block}
.exs{border-top:1px solid var(--line);padding:12px 0}
.exs:first-of-type{border-top:0}
.exs .top{display:flex;align-items:center;gap:8px}
.exs .top .nm{font-weight:700;flex:1}
.exs .top .tg{font-size:12px;color:var(--muted)}
.exs .edit{margin-top:10px;display:grid;gap:8px}
.seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{height:34px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--line);color:var(--text)}
:root[data-theme="light"] .seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(20,26,32,.12)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:.15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:23px;background:var(--accent-ink)}

/* ── auth ── */
#auth{max-width:400px;margin:0 auto;padding:calc(var(--safe-t) + 15vh) 24px 40px}
#auth .logo{font-family:var(--num);font-size:56px;font-weight:700;letter-spacing:.08em;line-height:1}
#auth .logo b{color:var(--accent-t)}
#auth p.lead{color:var(--muted);margin:8px 0 32px}
#auth form{display:grid;gap:10px;margin-top:20px}
#auth .or{text-align:center;color:var(--dim);font-size:12px;margin:18px 0 0}
#auth .err{color:var(--drink);font-size:13px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:700;font-size:13px;padding:10px 16px;border-radius:12px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.placeholder{text-align:center;color:var(--muted);padding:48px 16px}
.placeholder svg{width:56px;height:56px;color:var(--ride);margin-bottom:8px}
</style>
</head>
<body>

<!-- 設定未完了 -->
<div id="noconfig" class="hidden" style="padding:40px 24px;max-width:480px;margin:0 auto">
  <div class="brand" style="font-size:40px">ACT<b>LOG</b></div>
  <p style="color:var(--muted)">Firebaseの設定がまだです。<br>index.html の <code>firebaseConfig</code> に、Firebaseコンソールの値を貼り付けてください。</p>
</div>

<!-- ログイン -->
<div id="auth" class="hidden">
  <div class="logo">ACT<b>LOG</b></div>
  <p class="lead">毎日の積み上げを、ひと目で。</p>
  <button class="btn primary" id="btnGoogle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" opacity=".75"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z" opacity=".55"/><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.4 3-4.1 5.6-4.1z" opacity=".9"/></svg>
    Googleでログイン
  </button>
  <p class="or">またはメールアドレスで</p>
  <form id="emailForm" autocomplete="on">
    <input type="email" id="email" placeholder="メールアドレス" autocomplete="username" required>
    <input type="password" id="pass" placeholder="パスワード（6文字以上）" autocomplete="current-password" required minlength="6">
    <button class="btn ghost" type="submit">ログイン</button>
    <button class="linkbtn" type="button" id="btnSignup">はじめての場合：このメールアドレスで登録</button>
    <div class="err" id="authErr"></div>
  </form>
</div>

<!-- アプリ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand">ACT<b>LOG</b></div>
    <div class="datebar" id="datebar">
      <button class="iconbtn" id="dPrev" aria-label="前の日"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="d" id="dLabel"></div>
      <button class="iconbtn" id="dNext" aria-label="次の日"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </header>

  <!-- ホーム -->
  <section class="view" id="v-home">
    <div class="card">
      <h2>今日<span class="r num" id="hToday"></span></h2>
      <div class="today" id="todayTiles"></div>
    </div>
    <div class="card">
      <h2>連続記録</h2>
      <div class="streaks" id="streaks"></div>
    </div>
    <div class="card">
      <h2>積み上げ</h2>
      <table class="totals" id="totals"></table>
    </div>
    <div class="card">
      <h2>1年間</h2>

<div id="timer" class="hidden">
  <div class="t-name" id="tName"></div>

<script type="module">
// ═══════════════════════════════════════════════
//  Firebase設定
//  Firebaseコンソール → プロジェクトの設定 → マイアプリ（ウェブ）に表示される値を貼り付けてください
// ═══════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyCu75WOJ9EXIyR8TSufQJBLM6IA1V2mFrk",
  authDomain: "actlog-555cc.firebaseapp.com",
  projectId: "actlog-555cc",
  storageBucket: "actlog-555cc.firebasestorage.app",
  messagingSenderId: "1021262216779",
  appId: "1:1021262216779:web:f266ab39c981c88e7657ce",
};

import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, connectAuthEmulator,
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, connectFirestoreEmulator,
  doc, setDoc, getDoc, collection, query, where, onSnapshot, deleteField, serverTimestamp,
  writeBatch, arrayUnion, arrayRemove,
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const VERSION = 'v1.2.0（段階2：ライドログ）';

// localhost で ?emu を付けて開くとFirebaseエミュレータに接続（開発用）
const USE_EMU = ['localhost','127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).has('emu');
const cfg = USE_EMU ? { apiKey:'demo-key', authDomain:'demo-actlog.firebaseapp.com', projectId:'demo-actlog', appId:'demo' } : firebaseConfig;
const CONFIGURED = USE_EMU || !String(firebaseConfig.apiKey).startsWith('YOUR_');

let auth, db;
if (CONFIGURED) {
  const app = initializeApp(cfg);
  auth = getAuth(app);
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch (e) { db = initializeFirestore(app, {}); }
  if (USE_EMU) {
    connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings:true });
    connectFirestoreEmulator(db, '127.0.0.1', 8080);
  }
}

// ═══════════════════════════════════════════════
//  既定値
// ═══════════════════════════════════════════════
const DEFAULT_EXERCISES = [
  { id:'squat',     name:'スクワット',     type:'reps', sides:false, setsMin:3, setsMax:3, target:15, targetMax:15, on:true },
  { id:'lunge',     name:'ランジ',         type:'reps', sides:true,  setsMin:2, setsMax:3, target:10, targetMax:10, on:true },
  { id:'hipthrust', name:'ヒップスラスト', type:'reps', sides:false, setsMin:3, setsMax:3, target:15, targetMax:15, on:true },
  { id:'plank',     name:'プランク',       type:'time', sides:false, setsMin:3, setsMax:3, target:45, targetMax:60, on:true },
  { id:'sideplank', name:'サイドプランク', type:'time', sides:true,  setsMin:2, setsMax:2, target:30, targetMax:30, on:true },
];
const DEFAULT_SETTINGS = { maxHR:182, zones:[109,138,155,168], exercises:DEFAULT_EXERCISES, privacyM:500 };
const BODY_FIELDS = [
  { key:'weight', name:'体重',     unit:'kg', def:65.0, min:30, max:150 },
  { key:'fat',    name:'体脂肪率', unit:'%',  def:20.0, min:3,  max:60 },
  { key:'muscle', name:'骨格筋率', unit:'%',  def:33.0, min:15, max:60 },
];

// ═══════════════════════════════════════════════
//  ユーティリティ
// ═══════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDs = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseDs(s); d.setDate(d.getDate()+n); return ds(d); };
const todayStr = () => ds(new Date());
const WD = ['日','月','火','水','木','金','土'];
const r1 = v => Math.round(v*10)/10;
let toastT;
function toast(msg) { const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600); }

// 長押しで連続変化（加速あり）
// 再描画でボタンが消えても止まるよう、指を離したら必ず停止
let holdStop = null;
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => { holdStop?.(); holdStop = null; }));
function holdRepeat(btn, fn) {
  let t1, t2, n = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); holdStop?.(); holdStop = stop; fn(); n = 0;
    t1 = setTimeout(() => { t2 = setInterval(() => { n++; fn(); if (n === 15) { clearInterval(t2); t2 = setInterval(fn, 40); } }, 110); }, 400);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

// ═══════════════════════════════════════════════
//  状態
// ═══════════════════════════════════════════════
const S = {
  uid:null, user:null,
  settings: structuredClone(DEFAULT_SETTINGS),
  days: {},              // 'YYYY-MM-DD' -> doc data
  date: todayStr(),      // 記録画面で開いている日
  view: 'home',
  bodyDraft: null,       // {weight,fat,muscle}
  bodyDraftDate: null,
  exVal: {},             // exId -> 現在のステッパー値
  heatMode: 'all',
  editEx: null,
  rides: {},             // ライド要約 id -> data
  rideOpen: null,        // 詳細表示中のライド
  rideCache: {},         // 時系列データ
};
let unsubDays = null, unsubSet = null, unsubRides = null;

const dayRef = date => doc(db, 'users', S.uid, 'days', date);
const setRef = () => doc(db, 'users', S.uid, 'settings', 'main');
const saveDay = (date, patch) => setDoc(dayRef(date), { ...patch, date, updatedAt: serverTimestamp() }, { merge:true })
  .catch(e => { console.error(e); toast('保存に失敗しました'); });
const saveSettings = patch => setDoc(setRef(), patch, { merge:true }).catch(e => { console.error(e); toast('保存に失敗しました'); });

// ═══════════════════════════════════════════════
//  認証
// ═══════════════════════════════════════════════
if (!CONFIGURED) {
  $('noconfig').classList.remove('hidden');
} else {
  onAuthStateChanged(auth, user => {
    if (user) { S.user = user; S.uid = user.uid; startApp(); }
    else { stopApp(); $('auth').classList.remove('hidden'); $('app').classList.add('hidden'); $('tabs').classList.add('hidden'); }
  });
}
const AUTH_ERR = {
  'auth/invalid-credential':'メールアドレスかパスワードが違います', 'auth/wrong-password':'パスワードが違います',
  'auth/user-not-found':'登録されていません', 'auth/email-already-in-use':'このメールアドレスは登録済みです',
  'auth/weak-password':'パスワードは6文字以上にしてください', 'auth/invalid-email':'メールアドレスの形式が正しくありません',
  'auth/popup-closed-by-user':'ログインがキャンセルされました', 'auth/unauthorized-domain':'このドメインはFirebaseで許可されていません（承認済みドメインを確認）',
  'auth/operation-not-allowed':'このログイン方法はFirebaseで有効になっていません',
};
const authErr = e => { $('authErr').textContent = AUTH_ERR[e.code] || `ログインできませんでした（${e.code||e.message}）`; };
$('btnGoogle').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(authErr);
$('emailForm').onsubmit = e => { e.preventDefault(); $('authErr').textContent=''; signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value).catch(authErr); };
$('btnSignup').onclick = () => { $('authErr').textContent=''; createUserWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value).catch(authErr); };
$('btnLogout').onclick = () => signOut(auth);

function stopApp() { unsubDays?.(); unsubSet?.(); unsubRides?.(); unsubDays = unsubSet = unsubRides = null; S.days = {}; S.rides = {}; S.rideCache = {}; S.rideOpen = null; S.uid = null; }

function startApp() {
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden'); $('tabs').classList.remove('hidden');
  $('accName').innerHTML = `${esc(S.user.displayName || S.user.email || '')}<small>${esc(S.user.email||'')}</small>`;
  $('ver').textContent = VERSION;
  const from = addDays(todayStr(), -400);
  unsubDays = onSnapshot(query(collection(db,'users',S.uid,'days'), where('date','>=',from)), snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed') delete S.days[ch.doc.id]; else S.days[ch.doc.id] = ch.doc.data();
    });
    render();
  }, e => { console.error(e); toast('データを読み込めませんでした'); });
  unsubRides = onSnapshot(collection(db,'users',S.uid,'rides'), snap => {
    snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete S.rides[ch.doc.id]; else S.rides[ch.doc.id] = ch.doc.data(); });
    render();
  }, e => console.error(e));
  unsubSet = onSnapshot(setRef(), snap => {
    const d = snap.data();
    S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...(d||{}) };
    render();
  });
  render();
}

// ═══════════════════════════════════════════════
//  画面切替・日付
// ═══════════════════════════════════════════════
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v) {
  if (v === 'ride' || S.view === 'ride') { S.rideOpen = null; S._rideShown = null; disposeRideViz(); }   // ライドタブは常に一覧から
  S.view = v;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-'+v));
  window.scrollTo(0,0);
  render();
}
$('dPrev').onclick = () => { S.date = addDays(S.date, -1); render(); };
$('dNext').onclick = () => { if (S.date < todayStr()) { S.date = addDays(S.date, 1); render(); } };

function render() {
  if (!S.uid) return;
  $('datebar').classList.toggle('hidden', S.view !== 'log');
  const d = parseDs(S.date);
  $('dLabel').innerHTML = `${d.getMonth()+1}/${d.getDate()}<small>(${WD[d.getDay()]})</small>` + (S.date===todayStr() ? '' : '');
  $('dNext').disabled = S.date >= todayStr();
  if (S.view === 'home') renderHome();
  if (S.view === 'log') renderLog();
  if (S.view === 'set') renderSettings();
  if (S.view === 'ride') renderRides();
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-'+S.view));
}

// ═══════════════════════════════════════════════
//  記録：体組成
// ═══════════════════════════════════════════════
function latestBody(before) {
  // before より前（同日含まず）で最新の体組成
  const keys = Object.keys(S.days).filter(k => k < before && S.days[k].weight != null).sort();
  return keys.length ? S.days[keys[keys.length-1]] : null;
}
function renderBody() {
  const day = S.days[S.date] || {};
  const saved = day.weight != null;
  const prev = latestBody(S.date);
  // 日付が変わった時、または保存済みで編集中でない時は、保存値（なければ前回値）を表示
  if (S.bodyDraftDate !== S.date || !S.bodyDraft || (saved && !S._bodyDirty)) {
    const src = saved ? day : (prev || {});
    S.bodyDraft = Object.fromEntries(BODY_FIELDS.map(f => [f.key, src[f.key] ?? f.def]));
    S.bodyDraftDate = S.date;
    S._bodyDirty = false;
  }
  $('bodyRows').innerHTML = BODY_FIELDS.map(f => `
    <div class="bodyrow">
      <div class="nm">${f.name}<span class="prev num">${prev && prev[f.key]!=null ? '前回 '+prev[f.key].toFixed(1) : ''}</span></div>
      <div class="stepper ${saved?'':'unsaved'}" data-k="${f.key}">
        <button data-d="-1">−1</button><button class="big" data-d="-0.1">−</button>
        <div class="val">${S.bodyDraft[f.key].toFixed(1)}<small>${f.unit}</small></div>
        <button class="big" data-d="0.1">＋</button><button data-d="1">+1</button>
      </div>
    </div>`).join('');
  $('bodySave').classList.toggle('hidden', saved);
  $('bodyNote').textContent = saved ? '記録済み（変更すると自動で保存）' : (prev ? '前回の値を表示中' : '');
  $('bodyRows').querySelectorAll('.stepper').forEach(st => {
    const f = BODY_FIELDS.find(x => x.key === st.dataset.k);
    st.querySelectorAll('button').forEach(b => holdRepeat(b, () => {
      const v = Math.min(f.max, Math.max(f.min, r1(S.bodyDraft[f.key] + Number(b.dataset.d))));
      S.bodyDraft[f.key] = v; S._bodyDirty = true;
      st.querySelector('.val').innerHTML = `${v.toFixed(1)}<small>${f.unit}</small>`;
      if ((S.days[S.date]||{}).weight != null) queueBodySave();
    }));
  });
}
let bodyT;
function queueBodySave() {
  clearTimeout(bodyT);
  const date = S.date, draft = { ...S.bodyDraft };
  bodyT = setTimeout(() => { S._bodyDirty = false; saveDay(date, draft); toast('体組成を保存しました'); }, 900);
}
$('bodySave').onclick = () => { S._bodyDirty = false; saveDay(S.date, { ...S.bodyDraft }); toast('体組成を記録しました'); };

// ═══════════════════════════════════════════════
//  記録：飲酒
// ═══════════════════════════════════════════════
function renderAlcohol() {
  const a = (S.days[S.date]||{}).alcohol;
  $('alcNo').classList.toggle('on', a === false);
  $('alcYes').classList.toggle('on', a === true);
}
function setAlcohol(v) {
  const cur = (S.days[S.date]||{}).alcohol;
  saveDay(S.date, { alcohol: cur === v ? deleteField() : v });
}
$('alcNo').onclick = () => setAlcohol(false);
$('alcYes').onclick = () => setAlcohol(true);

// ═══════════════════════════════════════════════
//  記録：筋トレ
// ═══════════════════════════════════════════════
const activeEx = () => (S.settings.exercises || []).filter(e => e.on !== false);
const fmtVal = (ex, v) => ex.type === 'time' ? `${v}<small>秒</small>` : `${v}<small>回</small>`;
function targetText(ex) {
  const amt = ex.type === 'time'
    ? (ex.targetMax > ex.target ? `${ex.target}〜${ex.targetMax}秒` : `${ex.target}秒`)
    : (ex.targetMax > ex.target ? `${ex.target}〜${ex.targetMax}回` : `${ex.target}回`);
  const sets = ex.setsMax > ex.setsMin ? `${ex.setsMin}〜${ex.setsMax}` : `${ex.setsMin}`;
  return `${ex.sides ? '左右' : ''}${amt}×${sets}セット`;
}
const daySets = (day, id) => ((day||{}).sets||{})[id] || [];
function exDone(day, ex) { return daySets(day, ex.id).length >= ex.setsMin; }

function renderExercises() {
  const day = S.days[S.date] || {};
  const list = activeEx();
  const done = list.filter(ex => exDone(day, ex)).length;
  $('exSummary').textContent = `${done} / ${list.length} 種目`;
  $('exList').innerHTML = list.map(ex => {
    const sets = daySets(day, ex.id);
    if (S.exVal[ex.id] == null) S.exVal[ex.id] = sets.length ? sets[sets.length-1] : ex.target;
    const slots = Math.max(ex.setsMax, sets.length);
    const chips = Array.from({length:slots}, (_,i) => {
      if (i < sets.length) return `<div class="s ${i>=ex.setsMax?'extra':'done'}">${sets[i]}${ex.type==='time'?'s':''}</div>`;
      return `<div class="s">${i < ex.setsMin ? '' : '+'}</div>`;
    }).join('');
    const time = ex.type === 'time';
    return `
      <div class="ex" data-id="${ex.id}">
        <div class="ex-head"><span class="nm">${esc(ex.name)}</span><span class="tg">${targetText(ex)}</span>${exDone(day,ex)?'<span class="ok">DONE</span>':''}</div>
        <div class="sets">${chips}</div>
        <div class="ex-ctrl ${time?'time':''}">
          <button data-a="dec">−</button>
          <div class="v">${fmtVal(ex, S.exVal[ex.id])}</div>
          <button data-a="inc">＋</button>
          ${time ? `<button class="tm" data-a="timer" aria-label="タイマー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></button>` : ''}
          <button class="go" data-a="add">${ex.sides ? '左右 完了' : 'セット完了'}</button>
        </div>
        <div class="ex-foot"><button class="linkbtn" data-a="undo" ${sets.length?'':'disabled'}>最後のセットを取り消す</button></div>
      </div>`;
  }).join('') || '<div class="label">設定で種目を追加してください</div>';

const hasStrength = day => Object.values((day||{}).sets||{}).some(a => a.length);
const setCount = day => Object.values((day||{}).sets||{}).reduce((n,a) => n + a.length, 0);
const hasRide = day => !!(day && day.rides && day.rides.length);   // 段階2で使用

function streak(test, allowTodayEmpty = true) {
  let n = 0, d = todayStr();
  if (allowTodayEmpty && !test(S.days[d])) d = addDays(d, -1);
  while (test(S.days[d])) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(test) {
  const keys = Object.keys(S.days).sort();
  if (!keys.length) return 0;
  let best = 0, cur = 0, d = keys[0];
  const end = todayStr();
  while (d <= end) { if (test(S.days[d])) { cur++; best = Math.max(best, cur); } else cur = 0; d = addDays(d, 1); }
  return best;
}
function rangeStats(from, to) {
  let strengthDays=0, sets=0, sober=0, drink=0, bodyDays=0;
  const rs = ridesOf(from, to), rides = rs.length, rideKm = rs.reduce((n, r) => n + r.distance, 0) / 1000;
  for (let d = from; d <= to; d = addDays(d,1)) {
    const x = S.days[d]; if (!x) continue;
    if (hasStrength(x)) strengthDays++;
    sets += setCount(x);
    if (x.alcohol === false) sober++;
    if (x.alcohol === true) drink++;
    if (x.weight != null) bodyDays++;
  }
  return { strengthDays, sets, sober, drink, bodyDays, rides, rideKm };
}

function parseFit(buf) {
  const dv = new DataView(buf);
  const hs = dv.getUint8(0);
  if (String.fromCharCode(dv.getUint8(8), dv.getUint8(9), dv.getUint8(10), dv.getUint8(11)) !== '.FIT') throw new Error('FITファイルではありません');
  const end = Math.min(hs + dv.getUint32(4, true), buf.byteLength);
  const defs = {}, out = { records:[], sessions:[], fileId:null };
  let p = hs, lastTs = 0;
  const rd = (type, off, le) => {
    switch (type) {
      case 'u8': return dv.getUint8(off); case 's8': return dv.getInt8(off);
      case 'u16': return dv.getUint16(off, le); case 's16': return dv.getInt16(off, le);
      case 'u32': return dv.getUint32(off, le); case 's32': return dv.getInt32(off, le);
      case 'f32': return dv.getFloat32(off, le); case 'f64': return dv.getFloat64(off, le);
    }
  };
  while (p < end) {
    const h = dv.getUint8(p++);
    let local, tsOverride = null;
    if (h & 0x80) {                       // 圧縮タイムスタンプ付きデータ
      local = (h >> 5) & 3;
      const off = h & 0x1F;
      let ts = (lastTs & ~0x1F) + off;
      if (off < (lastTs & 0x1F)) ts += 0x20;
      tsOverride = ts; lastTs = ts;
    } else if (h & 0x40) {                // 定義メッセージ
      local = h & 0x0F;
      const le = dv.getUint8(p + 1) === 0;
      const gnum = dv.getUint16(p + 2, le);
      const nf = dv.getUint8(p + 4);
      p += 5;
      const fields = [];
      for (let i = 0; i < nf; i++, p += 3) fields.push({ num:dv.getUint8(p), size:dv.getUint8(p+1), bt:dv.getUint8(p+2) });
      let devSize = 0;
      if (h & 0x20) { const nd = dv.getUint8(p++); for (let i = 0; i < nd; i++, p += 3) devSize += dv.getUint8(p+1); }
      defs[local] = { le, gnum, fields, devSize };
      continue;
    } else {
      local = h & 0x0F;
    }
    const d = defs[local];
    if (!d) throw new Error('FITの形式を読み取れませんでした');
    const want = FIT_WANT[d.gnum];
    const m = want ? {} : null;
    for (const f of d.fields) {
      if (want && want[f.num] !== undefined) {
        const bt = FIT_BT[f.bt];
        if (bt && f.size === bt[0]) {
          const v = rd(bt[1], p, d.le);
          if (v !== bt[2] && !(bt[1][0] === 'f' && !isFinite(v))) m[want[f.num]] = v;
        }
      }
      if (f.num === 253 && f.size === 4) { const v = dv.getUint32(p, d.le); if (v !== 0xFFFFFFFF) lastTs = v; }
      p += f.size;
    }
    p += d.devSize;
    if (!m) continue;
    if (tsOverride !== null && m.ts === undefined) m.ts = tsOverride;
    if (d.gnum === 20) out.records.push(m);
    else if (d.gnum === 18) out.sessions.push(m);
    else if (d.gnum === 0 && !out.fileId) out.fileId = m;
  }
  return out;
}

// ZIP（Garmin Connectの「オリジナルをエクスポート」）から .fit を取り出す
async function unzipFits(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('ZIPを読み取れませんでした');
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const res = [];
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + xl + cl;
    if (!/\.fit$/i.test(name)) continue;
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const data = u8.slice(start, start + csize);
    if (method === 0) res.push({ name, buf:data.buffer });
    else if (method === 8) {
      const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      res.push({ name, buf: await new Response(ds).arrayBuffer() });
    }
  }
  return res;
}

const hav = (a, b, c, d) => {
  const R = 6371000, r = Math.PI / 180;
  const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
};

// 解析：要約・ゾーン・ドリフト・保存用の間引きデータ
function analyzeRide(fit, opt) {
  const { zones, privacyM } = opt;
  const recs = fit.records.filter(r => r.ts != null).sort((a, b) => a.ts - b.ts);
  if (recs.length < 10) throw new Error('記録が少なすぎます');
  const s = fit.sessions[0] || {};
  const t0 = recs[0].ts;
  const pts = recs.map(r => ({
    t: r.ts - t0,
    lat: r.lat != null && r.lng != null && r.lat !== 0 ? r.lat * SEMI : null,
    lng: r.lat != null && r.lng != null && r.lat !== 0 ? r.lng * SEMI : null,
    alt: r.ealt != null ? r.ealt / 5 - 500 : r.alt != null ? r.alt / 5 - 500 : null,
    hr: r.hr ?? null, cad: r.cad ?? null,
    dist: r.dist != null ? r.dist / 100 : null,
    spd: r.espd != null ? r.espd / 1000 : r.spd != null ? r.spd / 1000 : null,
    pwr: r.pwr ?? null, tmp: r.tmp ?? null,
  }));
  // 時間で重みづけ（次の点までの秒数。30秒超の間隔は停止とみなし除外）
  const zt = [0, 0, 0, 0, 0];
  let hrT = 0, hrSum = 0, hrMax = 0, cadT = 0, cadSum = 0, tmpT = 0, tmpSum = 0, tmpMin = 99, tmpMax = -99, pwrT = 0, pwrSum = 0, spdMax = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], dt = pts[i+1].t - a.t;
    if (dt <= 0 || dt > 30) continue;
    if (a.hr) { zt[zones.filter(z => a.hr > z).length] += dt; hrT += dt; hrSum += a.hr * dt; }
    if (a.cad) { cadT += dt; cadSum += a.cad * dt; }     // ケイデンスは0（惰性）を除いた平均
    if (a.tmp != null) { tmpT += dt; tmpSum += a.tmp * dt; }
    if (a.pwr != null) { pwrT += dt; pwrSum += a.pwr * dt; }
  }
  for (const a of pts) {
    if (a.hr) hrMax = Math.max(hrMax, a.hr);
    if (a.tmp != null) { tmpMin = Math.min(tmpMin, a.tmp); tmpMax = Math.max(tmpMax, a.tmp); }
    if (a.spd != null) spdMax = Math.max(spdMax, a.spd);
  }
  // 心拍ドリフト（速度/心拍、前半と後半の比較）
  const mv = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], dt = pts[i+1].t - a.t;
    if (dt > 0 && dt <= 30 && a.hr && a.spd != null && a.spd > 2) mv.push({ dt, hr:a.hr, spd:a.spd });
  }
  let drift = null;
  const mvT = mv.reduce((n, x) => n + x.dt, 0);
  if (mvT > 1200) {
    let acc = 0; const h = [[0,0,0],[0,0,0]];
    for (const x of mv) { const k = acc < mvT / 2 ? 0 : 1; h[k][0] += x.dt; h[k][1] += x.spd * x.dt; h[k][2] += x.hr * x.dt; acc += x.dt; }
    const ef = h.map(([t, sp, hr]) => (sp / t) / (hr / t));
    drift = Math.round((ef[0] - ef[1]) / ef[0] * 1000) / 10;
  }
  // 獲得標高（セッション値がなければ記録から計算）
  let ascent = s.ascent ?? null;
  if (ascent == null) { let up = 0, last = null; for (const a of pts) if (a.alt != null) { if (last != null && a.alt - last > 0.5) up += a.alt - last; if (last == null || Math.abs(a.alt - last) > 0.5) last = a.alt; } ascent = Math.round(up); }
  const lastDist = [...pts].reverse().find(a => a.dist != null)?.dist;
  const distance = s.dist != null ? s.dist / 100 : (lastDist ?? 0);
  const moving = s.timer != null ? s.timer / 1000 : hrT;
  const hasGps = pts.some(a => a.lat != null);
  // 保存用：5秒以上の間隔に間引き
  const keep = [];
  for (const a of pts) if (!keep.length || a.t - keep[keep.length-1].t >= 5) keep.push(a);
  const r1 = v => v == null ? null : Math.round(v * 10) / 10;
  const streams = {
    t: keep.map(a => a.t),
    d: keep.map(a => a.dist == null ? null : Math.round(a.dist) ),
    hr: keep.map(a => a.hr), cad: keep.map(a => a.cad),
    spd: keep.map(a => a.spd == null ? null : r1(a.spd * 3.6)),
    alt: keep.map(a => r1(a.alt)), tmp: keep.map(a => a.tmp),
  };
  if (pts.some(a => a.pwr != null)) streams.pwr = keep.map(a => a.pwr);
  // ルート：プライバシーゾーン（出発・到着地点の周囲）を除いて保存
  let route = null;
  if (hasGps) {
    const g = pts.filter(a => a.lat != null);
    const A = g[0], B = g[g.length-1];
    const lat = [], lng = [], hr = [];
    let prev = null;
    for (const a of g) {
      if (privacyM > 0 && (hav(A.lat, A.lng, a.lat, a.lng) < privacyM || hav(B.lat, B.lng, a.lat, a.lng) < privacyM)) { prev = null; lat.push(null); lng.push(null); hr.push(null); continue; }
      if (prev && hav(prev.lat, prev.lng, a.lat, a.lng) < 15) continue;   // 15m未満の移動は間引く
      lat.push(Math.round(a.lat * 1e5) / 1e5); lng.push(Math.round(a.lng * 1e5) / 1e5); hr.push(a.hr);
      prev = a;
    }
    // 連続するnull（区切り）を1つにまとめ、先頭・末尾のnullを除く
    const L = [], G = [], H = [];
    lat.forEach((v, i) => { if (v == null && (L.length === 0 || L[L.length-1] == null)) return; L.push(v); G.push(lng[i]); H.push(hr[i]); });
    while (L.length && L[L.length-1] == null) { L.pop(); G.pop(); H.pop(); }
    route = { lat:L, lng:G, hr:H };
  }
  const start = (s.start ?? recs[0].ts) + FIT_EPOCH;
  const sd = new Date(start * 1000);
  const pad = n => String(n).padStart(2, '0');
  return {
    id: `${sd.getUTCFullYear()}${pad(sd.getUTCMonth()+1)}${pad(sd.getUTCDate())}T${pad(sd.getUTCHours())}${pad(sd.getUTCMinutes())}${pad(sd.getUTCSeconds())}`,
    summary: {
      start: start * 1000,
      date: `${sd.getFullYear()}-${pad(sd.getMonth()+1)}-${pad(sd.getDate())}`,
      indoor: !hasGps || s.sub === 6 || s.sub === 58,
      distance: Math.round(distance),
      elapsed: Math.round(s.elapsed != null ? s.elapsed / 1000 : pts[pts.length-1].t),
      moving: Math.round(moving),
      ascent,
      avgSpeed: moving > 0 ? r1(distance / moving * 3.6) : null,
      maxSpeed: r1((s.emaxSpd != null ? s.emaxSpd / 1000 : s.maxSpd != null ? s.maxSpd / 1000 : spdMax) * 3.6),
      avgHr: s.avgHr ?? (hrT ? Math.round(hrSum / hrT) : null), maxHr: s.maxHr ?? (hrMax || null),
      avgCad: s.avgCad ?? (cadT ? Math.round(cadSum / cadT) : null),
      avgPwr: pwrT ? Math.round(pwrSum / pwrT) : null,
      avgTmp: tmpT ? Math.round(tmpSum / tmpT) : null, minTmp: tmpT ? tmpMin : null, maxTmp: tmpT ? tmpMax : null,
      kcal: s.kcal ?? null,
      zoneSec: zt.map(Math.round), zones: [...zones],
      z2pct: hrT ? Math.round((zt[0] + zt[1]) / hrT * 100) : null,
      drift,
      hasRoute: !!(route && route.lat.length),
    },
    streams, route,
  };
}

async function importFiles(files) {
  const msg = $('importMsg');
  let ok = 0, dup = 0; const ng = [];
  msg.textContent = '解析中…';
  for (const file of files) {
    try {
      const buf = await file.arrayBuffer();
      const fits = /\.zip$/i.test(file.name) ? await unzipFits(buf) : [{ name:file.name, buf }];
      if (!fits.length) throw new Error('ZIPの中にFITがありません');
      for (const f of fits) {
        const r = analyzeRide(parseFit(f.buf), { zones:S.settings.zones, privacyM:S.settings.privacyM ?? 500 });
        if (S.rides[r.id]) { dup++; continue; }
        const b = writeBatch(db);
        b.set(rideRef(r.id), { ...r.summary, id:r.id, file:f.name, importedAt:serverTimestamp() });
        b.set(streamRef(r.id), { ...r.streams, route:r.route });
        b.set(dayRef(r.summary.date), { date:r.summary.date, rides:arrayUnion(r.id), updatedAt:serverTimestamp() }, { merge:true });
        await b.commit();
        S.rides[r.id] = { ...r.summary, id:r.id };
        ok++;
      }
    } catch (e) { console.error(e); ng.push(`${file.name}：${e.message}`); }
  }
  const parts = [];
  if (ok) parts.push(`${ok}件を取り込みました`);
  if (dup) parts.push(`${dup}件は取り込み済みのためスキップ`);
  if (ng.length) parts.push(`失敗 ${ng.length}件（${ng.join(' / ')}）`);
  toast(parts[0] || '取り込めませんでした');
  render();
  const m2 = $('importMsg'); if (m2) m2.textContent = parts.join('、');
}

    const b = writeBatch(db);
    b.delete(rideRef(r.id)); b.delete(streamRef(r.id));
    b.set(dayRef(r.date), { rides:arrayRemove(r.id), updatedAt:serverTimestamp() }, { merge:true });
    await b.commit().catch(err => { console.error(err); toast('削除に失敗しました'); });
    delete S.rides[r.id]; S.rideOpen = null; disposeRideViz(); toast('削除しました'); render();
  };
  // 時系列データ（詳細を開いたときだけ読む）
  let st = S.rideCache[r.id];
  try {
    if (!st) { const snap = await getDoc(streamRef(r.id)); st = S.rideCache[r.id] = snap.data(); }
    if (!st) throw new Error('データがありません');
  } catch (e) { $('rideCharts').innerHTML = `<div class="label">グラフを読み込めませんでした（${esc(e.message)}）</div>`; return; }
  if (S.rideOpen !== r.id) return;
  drawRideCharts(r, st).catch(e => { console.error(e); $('rideCharts').innerHTML = '<div class="label">グラフを表示できませんでした（通信を確認してください）</div>'; });
  if (r.hasRoute && st.route) drawRideMap(st.route, z).catch(e => { console.error(e); const m = $('rideMap'); if (m) m.innerHTML = '<div class="label" style="padding:16px">地図を表示できませんでした</div>'; });
}

async function drawRideCharts(r, st) {
  await loadScript(LIB.echarts);
  if (S.rideOpen !== r.id) return;
  const useD = st.d && st.d.some(v => v != null) && !r.indoor;
  const xs = useD ? st.d.map(v => v == null ? null : v / 1000) : st.t.map(v => v / 60);
  $('chartX').textContent = useD ? '横軸：距離（km）' : '横軸：時間（分）';
  const C = { text:cssVar('--muted'), line:cssVar('--line'), dim:cssVar('--dim') };
  const z = r.zones || S.settings.zones;
  const defs = [
    { k:'hr',  name:'心拍',       unit:'bpm',  color:cssVar('--drink') },
    { k:'spd', name:'速度',       unit:'km/h', color:cssVar('--ride') },
    { k:'cad', name:'ケイデンス', unit:'rpm',  color:cssVar('--strength'), scatter:true },
    { k:'alt', name:'標高',       unit:'m',    color:cssVar('--body'), area:true },
    { k:'tmp', name:'気温',       unit:'℃',   color:'#e0b400' },
    { k:'pwr', name:'パワー',     unit:'W',    color:cssVar('--accent-t') },
  ].filter(d => st[d.k] && st[d.k].some(v => v != null && v !== 0));
  $('rideCharts').innerHTML = defs.map(d => `<div class="chart-t">${d.name}<span>${d.unit}</span></div><div class="chart" id="ch-${d.k}"></div>`).join('');
  const xMax = Math.max(...xs.filter(v => v != null));
  defs.forEach((d, i) => {
    const data = xs.map((x, j) => (x == null || st[d.k][j] == null) ? null : [x, st[d.k][j]]).filter(Boolean);
    const ch = echarts.init($('ch-' + d.k), null, { renderer:'canvas' });
    const last = i === defs.length - 1;
    ch.setOption({
      animation:false, grid:{ left:36, right:8, top:6, bottom: last ? 22 : 6 },
      xAxis:{ type:'value', min:0, max:Math.ceil(xMax), axisLabel:{ show:last, color:C.dim, fontSize:10 }, axisLine:{ lineStyle:{ color:C.line } }, axisTick:{ show:false }, splitLine:{ show:false } },
      yAxis:{ type:'value', scale:true, splitNumber:3, axisLabel:{ color:C.dim, fontSize:10 }, splitLine:{ lineStyle:{ color:C.line, opacity:.6 } } },
      tooltip:{ trigger:'axis', confine:true, backgroundColor:cssVar('--surface'), borderColor:C.line, textStyle:{ color:cssVar('--text'), fontSize:12 },
        axisPointer:{ type:'line', lineStyle:{ color:C.dim } },
        formatter: p => p.length ? `${useD ? p[0].value[0].toFixed(1) + ' km' : Math.round(p[0].value[0]) + ' 分'}<br><b>${p[0].value[1]}</b> ${d.unit}` : '' },
      series:[{
        type: d.scatter ? 'scatter' : 'line', data, symbol: d.scatter ? 'circle' : 'none', symbolSize: d.scatter ? 2 : 0, large: !!d.scatter, showSymbol:false, sampling:'lttb',
        lineStyle:{ color:d.color, width:1.5 }, itemStyle:{ color:d.color, opacity:.6 },
        areaStyle: d.area ? { color:d.color, opacity:.18 } : undefined,
        markArea: d.k === 'hr' ? { silent:true, data: [[60, z[0]], [z[0], z[1]], [z[1], z[2]], [z[2], z[3]], [z[3], 230]].map((b, zi) => [{ yAxis:b[0], itemStyle:{ color:ZONE_COLORS[zi], opacity:.07 } }, { yAxis:b[1] }]) } : undefined,
      }],
    });
    ch.group = 'ride';
    rideCharts.push(ch);
  });
  echarts.connect('ride');
}

async function drawRideMap(route, z) {
  loadCss(LIB.leafletCss);
  await loadScript(LIB.leaflet);
  const el = $('rideMap'); if (!el) return;
  const mobile = matchMedia('(pointer:coarse)').matches;
  rideMap = L.map(el, { zoomControl:true, attributionControl:true, dragging:!mobile, tap:false, scrollWheelZoom:false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'&copy; OpenStreetMap contributors' }).addTo(rideMap);
  const zi = hr => hr == null ? 1 : z.filter(b => hr > b).length;
  const bounds = [];
  let seg = [], segZ = null;
  const flush = () => { if (seg.length > 1) L.polyline(seg, { color:ZONE_COLORS[segZ], weight:4, opacity:.95, lineCap:'round' }).addTo(rideMap); };
  for (let i = 0; i < route.lat.length; i++) {
    if (route.lat[i] == null) { flush(); seg = []; segZ = null; continue; }
    const p = [route.lat[i], route.lng[i]], k = zi(route.hr[i]);
    bounds.push(p);
    if (segZ !== null && k !== segZ) { seg.push(p); flush(); seg = [p]; } else seg.push(p);
    segZ = k;
  }
  flush();
  if (bounds.length) rideMap.fitBounds(bounds, { padding:[16, 16] });
  if (mobile) rideMap.on('click', () => rideMap.dragging.enabled() ? rideMap.dragging.disable() : rideMap.dragging.enable());
}
window.addEventListener('resize', () => rideCharts.forEach(c => c.resize()));

// ═══════════════════════════════════════════════
//  表示テーマ（端末ごとに保存）
// ═══════════════════════════════════════════════
const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
function themePref() { try { return localStorage.getItem('actlog-theme') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme() {
  const pref = themePref();
  const dark = pref === 'dark' || (pref === 'auto' && mqDark.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = dark ? '#0b0d10' : '#f3f5f7';
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === pref));
}
document.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => {
  try { localStorage.setItem('actlog-theme', b.dataset.t); } catch (e) {}
  applyTheme(); render();
});
mqDark.addEventListener?.('change', () => { if (themePref() === 'auto') { applyTheme(); render(); } });
applyTheme();

// 日付が変わったら今日に追従（アプリを開きっぱなしの場合）
let lastToday = todayStr();
setInterval(() => { const t = todayStr(); if (t !== lastToday) { if (S.date === lastToday) S.date = t; lastToday = t; render(); } }, 60000);

// PWA
if ('serviceWorker' in navigator && !USE_EMU) navigator.serviceWorker.register('sw.js').catch(()=>{});

go('home');
</script>
